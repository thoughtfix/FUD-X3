; FUD-X3 — FUD firmware for the XTEINK X3 (ESP32-C3, 792x528 1-bit e-ink).
; Passive counter-surveillance only. No transmit/attack code, ever.
;
; Hardware layer comes from the Open X4 community SDK, pulled in as a git
; submodule (deps/community-sdk) and referenced as a library — not copied.
; Credit: EInkDisplay / InputManager / SDCardManager / BatteryMonitor are from
; https://github.com/crosspoint-reader/community-sdk (MIT).

[platformio]
default_envs = x3

[env:x3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Preserve the stock bootloader: app flashed at 0x10000, 16MB dual-OTA layout.
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DENABLE_SERIAL_LOG
  -DDISABLE_FS_H_WARNING=1
  -std=gnu++2a

build_unflags =
  -std=gnu++11

lib_deps =
  symlink://deps/community-sdk/libs/display/EInkDisplay
  symlink://deps/community-sdk/libs/hardware/InputManager
  symlink://deps/community-sdk/libs/hardware/SDCardManager
  adafruit/Adafruit GFX Library @ 1.11.11
  h2zero/NimBLE-Arduino @ ^2.2.0
